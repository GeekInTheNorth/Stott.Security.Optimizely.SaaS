meta:
  app_id: stott_security
  display_name: Stott Security
  version: 0.0.1-dev.25
  vendor: netcel
  summary: Manage Content Security Policy and response headers for Optimizely CMS (SaaS).
  support_url: https://github.com/GeekInTheNorth/Stott.Security.Optimizely.SaaS
  contact_email: support@stott.pro
  categories:
    - Content Management
  # `all` matches the reference app. Cannot be combined with specific zones.
  availability:
    - all

# node22-cms-ext (not plain node22) is required for CMS UI extensions.
runtime: node22-cms-ext

# ---------------------------------------------------------------------------
# UI extensions
#
# `view` is the full-page surface, declared by the build-time SDK as:
#
#   export declare const UI_EXTENSION_INJECTION_POINTS: readonly ["sidebar", "view"];
#
# WARNING: @optimizely/ocp-cms-ui-extensions-sdk must not be installed from the
# npm `latest` dist-tag, which resolves to a build declaring ["sidebar"] only and
# rejects `view` at validation. package.json pins an exact version for this
# reason — check UI_EXTENSION_INJECTION_POINTS in the installed package before
# changing it.
#
# Validator rules (from dist/validator.js):
#   - `name` must be unique across ALL injection points
#   - `entry_point` must be unique across ALL injection points
#   - `display_name` must not be blank
#   - a built bundle must exist at <baseDir>/cms-ui-extensions/<entry_point>.js
# ---------------------------------------------------------------------------
ui_extensions:
  view:
    - name: stott-security-console
      entry_point: SecurityConsole
      display_name: Stott Security

functions:
  # Backend for the console. Reachable only via
  # context.extension.invokeFunction() — no public URL.
  cms_extension:
    entry_point: CmsExtension
    description: Backend for the Stott Security console (draft CRUD and publish).
    accepts: cms_ui_extension

  # Public, GUUID-resolved function consumed by the Next.js head.
  #
  # Deliberately NOT `global: true`. A GlobalFunction has no installation
  # context — no installId, no trackerId — and can therefore only reach
  # storage.sharedKvStore. As a regular App.Function this resolves an
  # installation from the UUID in its public URL and so can read the same
  # per-installation storage.kvStore that cms_extension writes to. That shared
  # partition is what the whole precompute-on-publish design rests on.
  compiled_headers:
    entry_point: CompiledHeaders
    description: Serves compiled security headers to the site head.
