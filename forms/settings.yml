# OCP settings form.
#
# This file has to exist — the SDK asset validator lists `forms/settings.yml`
# among its required assets — but the app deliberately stores nothing in it.
# `storage.settings.get()` has no caller anywhere in the codebase: the draft in
# key-value storage is the system of record, and the console writes it through
# `CmsExtension`. A field added here does nothing until something reads it back,
# so this section exists only to point editors at the place that does work.
sections:
  - key: about
    label: Stott Security
    elements:
      - type: instructions
        text: >
          Everything is configured in the security console: In the CMS, go to Extensions in the left hand menu and then open **Stott Security**.
          Content Security Policy, Permissions Policy and Response Headers, Previews and Import/Export tooling all live there.

          Edits are held as a draft. Nothing your site serves changes until you publish from the console.
