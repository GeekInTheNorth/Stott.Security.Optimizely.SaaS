<!--
  Stott Security marque. Shared with the PaaS product, so edit both in step.

  Geometry only, no text: an SVG <text> element renders in whatever font the
  viewer happens to have, and the App Directory, NuGet and GitHub are all
  outside our control.

  The counters between the slash and the chevrons are wider than they look
  comfortable at full size. That is deliberate — at 20px, which is what a CMS
  navigation row and a browser tab get, tighter spacing merges the three strokes
  into a single blob.

  Racing green rather than navy: navy is close enough in hue to the dark grounds
  used by the App Directory, NuGet and GitHub that the shield's silhouette
  dissolves into them. Green holds its edge on light and dark alike, and reads as
  safe-and-passing rather than merely serious.

  Deliberately NOT Optimizely's green, and deliberately not on an Axiom token.
  Optimizely rebranded onto greens, so a green mark risks being read as the
  platform's own rather than this product's. The separation is carried by hue:
  Optimizely's `brand.*` ramp is yellow-leaning (`brand.700` #3AB533 sits near
  117°, the signature `brand.500` #ABFF44 nearer 85°), so these two stops stay
  blue-leaning at 156–160° — bottle green, not grass green. Matching the token
  palette would make this look like a platform badge; that is the outcome being
  avoided, so do not "correct" these values onto `brand.*` or `green.*`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Stott Security">
  <defs>
    <linearGradient id="shield-grad" gradientUnits="userSpaceOnUse" x1="18" y1="18" x2="110" y2="118">
      <stop offset="0" stop-color="#01301F"/>
      <stop offset="1" stop-color="#1AA06B"/>
    </linearGradient>
  </defs>
  <path fill="url(#shield-grad)" d="M24 18H104a6 6 0 0 1 6 6v38c0 26-18 45-46 56-28-11-46-30-46-56V24a6 6 0 0 1 6-6Z"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M49 49 36 62l13 13"/>
    <path d="M79 49 92 62 79 75"/>
    <path d="M70 45 58 79"/>
  </g>
</svg>
