<!--
  Stott Security marque. Shared with the PaaS product, so edit both in step.

  Identical to icon.svg by design: OCP requires both files, and a single mark
  that scales is worth more than a second variant that has to be kept in sync.
  If a wide lockup is ever wanted here, it needs a wordmark converted to paths —
  live text cannot be relied on outside our own pages.

  Colour rationale lives in icon.svg. Keep the two gradients identical.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Stott Security">
  <defs>
    <linearGradient id="shield-grad" gradientUnits="userSpaceOnUse" x1="18" y1="18" x2="110" y2="118">
      <stop offset="0" stop-color="#01301F"/>
      <stop offset="1" stop-color="#1AA06B"/>
    </linearGradient>
  </defs>
  <path fill="url(#shield-grad)" d="M24 18H104a6 6 0 0 1 6 6v38c0 26-18 45-46 56-28-11-46-30-46-56V24a6 6 0 0 1 6-6Z"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M49 49 36 62l13 13"/>
    <path d="M79 49 92 62 79 75"/>
    <path d="M70 45 58 79"/>
  </g>
</svg>
